name: Dependency Tree

on:
  workflow_dispatch:

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Dump debugRuntimeClasspath dependency tree
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath > deps.txt

      - name: Grep for the legacy support library
        run: |
          echo "---- lines mentioning com.android.support ----"
          grep -n "com.android.support" deps.txt || echo "no matches"

      - name: Upload full dependency tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-txt
          path: deps.txt
